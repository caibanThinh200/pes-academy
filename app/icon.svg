<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" role="img" aria-label="PES Academy crest">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A1D5" />
      <stop offset="50%" stop-color="#75AADB" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M50 4 C75 4 92 12 92 28 C92 76 68 108 50 116 C32 108 8 76 8 28 C8 12 25 4 50 4 Z" />
    </clipPath>
  </defs>

  <!-- Shield Base Outline & Shadow -->
  <path d="M50 4 C75 4 92 12 92 28 C92 76 68 108 50 116 C32 108 8 76 8 28 C8 12 25 4 50 4 Z" fill="#282327" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Shield Stripes Group clipped -->
  <g clip-path="url(#shieldClip)">
    <!-- Base White -->
    <rect x="0" y="0" width="100" height="120" fill="#FFFFFF" />
    <!-- Sky Blue Stripes (Albiceleste) -->
    <rect x="8" y="0" width="20" height="120" fill="#43A1D5" />
    <rect x="42" y="0" width="16" height="120" fill="#43A1D5" />
    <rect x="72" y="0" width="20" height="120" fill="#43A1D5" />

    <!-- Top Navy Banner for PES Academy -->
    <path d="M0 0 L100 0 L100 32 L50 38 L0 32 Z" fill="#282327" />
    <text x="50" y="22" text-anchor="middle" fill="#FACC15" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="2">PES</text>
  </g>

  <!-- Golden Sun of May (Sol de Mayo) in center -->
  <g transform="translate(50, 56)">
    <!-- Sun rays -->
    <g stroke="#FACC15" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-17" x2="0" y2="-12" />
      <line x1="0" y1="12" x2="0" y2="17" />
      <line x1="-17" y1="0" x2="-12" y2="0" />
      <line x1="12" y1="0" x2="17" y2="0" />
      <line x1="-12" y1="-12" x2="-8.5" y2="-8.5" />
      <line x1="8.5" y1="8.5" x2="12" y2="12" />
      <line x1="12" y1="-12" x2="8.5" y2="-8.5" />
      <line x1="-8.5" y1="8.5" x2="-12" y2="12" />
    </g>
    <!-- Sun disk -->
    <circle cx="0" cy="0" r="8" fill="url(#goldGrad)" stroke="#A16207" stroke-width="1" />
  </g>

  <!-- Football at Bottom Center -->
  <g transform="translate(50, 88)">
    <circle cx="0" cy="0" r="13" fill="#FFFFFF" stroke="#282327" stroke-width="2" />
    <!-- Football Pentagon & lines -->
    <polygon points="0,-4 3.8,-1.2 2.3,3.5 -2.3,3.5 -3.8,-1.2" fill="#282327" />
    <line x1="0" y1="-4" x2="0" y2="-13" stroke="#282327" stroke-width="1.5" />
    <line x1="3.8" y1="-1.2" x2="12" y2="-3" stroke="#282327" stroke-width="1.5" />
    <line x1="2.3" y1="3.5" x2="8" y2="10" stroke="#282327" stroke-width="1.5" />
    <line x1="-2.3" y1="3.5" x2="-8" y2="10" stroke="#282327" stroke-width="1.5" />
    <line x1="-3.8" y1="-1.2" x2="-12" y2="-3" stroke="#282327" stroke-width="1.5" />
  </g>

  <!-- Two Gold Stars (World Champions tribute) -->
  <g fill="#FACC15">
    <path d="M28 26 L29.5 30 L34 30.5 L30.5 33 L31.5 37 L28 34.5 L24.5 37 L25.5 33 L22 30.5 L26.5 30 Z" transform="scale(0.8) translate(5,-5)" />
    <path d="M72 26 L73.5 30 L78 30.5 L74.5 33 L75.5 37 L72 34.5 L68.5 37 L69.5 33 L66 30.5 L70.5 30 Z" transform="scale(0.8) translate(15,-5)" />
  </g>
</svg>
